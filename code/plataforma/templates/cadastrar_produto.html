{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Cadastrar Novo Produto
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Salvar Produto
            </button>

            <a href="{% url 'produtos' %}" class="btn btn-secondary">
                Voltar
            </a>

        </form>

    </div>

</div>

{% endblock %}
