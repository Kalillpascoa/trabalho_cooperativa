<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cooperativa Agrícola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'pagina_inicial' %}">Cooperativa</a>

        <ul class="navbar-nav">

            <li class="nav-item"><a class="nav-link" href="{% url 'pagina_inicial' %}">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'produtores' %}">Produtores</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'clientes' %}">Clientes</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'produtos' %}">Produtos</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'estoque' %}">Estoque</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'pedidos' %}">Pedidos</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>

            {% if user.is_authenticated %}
                <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Sair</a></li>
            {% else %}
                <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'cadastro' %}">Cadastro</a></li>
            {% endif %}

        </ul>

    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
