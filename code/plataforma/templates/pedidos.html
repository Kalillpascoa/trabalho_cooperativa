{% extends 'base.html' %}

{% block content %}

<h2>Pedidos</h2>

<table class="table table-striped">

<thead>
<tr>
    <th>Cliente</th>
    <th>Produto</th>
    <th>Quantidade</th>
    <th>Valor Total</th>
</tr>
</thead>

<tbody>

{% for pedido in pedidos %}

<tr>
    <td>{{ pedido.cliente.nome }}</td>
    <td>{{ pedido.produto.nome }}</td>
    <td>{{ pedido.quantidade }}</td>
    <td>R$ {{ pedido.valor_total }}</td>
</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
